services:
  credvoice-api:
    build: .
    container_name: credvoice-api
    ports:
      - "8008:8000"
    environment:
      - APP_ENV=production
      - SESSION_STORE_TYPE=redis
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=openai
      - LLM_MODEL=gpt-4o-mini
      # To use Gemini: set LLM_PROVIDER=gemini above, LLM_MODEL=gemini-2.0-flash,
      # and supply GEMINI_API_KEY via env_file or a secrets manager — never hardcode it.
      # - GEMINI_API_KEY=your_gemini_api_key_here
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: credvoice-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
